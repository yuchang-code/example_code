<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人網站</title>
  <style>
    /* 整個網頁 */
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background-color: #f4f6fa;
      color: #263244;
    }

    /* 上方選單 */
    header {
      background-color: #253b59;
      color: white;
      padding: 18px 10%;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }

    header h1 { margin: 0; font-size: 22px; }
    nav a { color: white; text-decoration: none; margin-left: 18px; }
    nav a:hover { text-decoration: underline; }

    /* 中間內容 */
    main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .welcome { margin-bottom: 28px; }
    .welcome h2 { font-size: 32px; margin-bottom: 10px; }

    /* 讓內容變成一格一格的卡片 */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background-color: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    .card h3 { margin-top: 0; }

    /* 照片區：還沒放照片時先顯示提示 */
    .photo-box {
      height: 230px;
      border-radius: 10px;
      background-color: #e1e9f4;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #52677f;
    }

    /* 放上照片後會用到 */
    .photo {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* 頁尾 */
    footer {
      background-color: #253b59;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 48px;
    }

    /* 手機畫面改成一排一格 */
    @media (max-width: 768px) {
      header { display: block; text-align: center; }
      nav { margin-top: 12px; }
      nav a { margin: 0 8px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>我的個人網站</h1>
    <nav>
      <a href="intro.html">首頁</a>
      <a href="about.html">關於我</a>
      <a href="experience.html">我的經歷</a>
    </nav>
  </header>

  <main id="home">
    <div class="welcome">
      <h2>你好！我是＿＿＿＿ 👋</h2>
      <p>歡迎來到我的個人網站！這裡記錄我的故事、興趣和學習成果。</p>
    </div>

    <div class="cards">
      <div class="card">
        <h3>📷 我的照片</h3>
        <div class="photo-box">照片放在這裡</div>
        <!-- 想放照片：刪除上方 div，改成下面這行 -->
        <!-- <img class="photo" src="photo.jpg" alt="我的照片"> -->
      </div>

      <div class="card" id="about">
        <h3>👤 基本資料</h3>
        <p>姓名：＿＿＿＿</p>
        <p>學校：＿＿＿＿</p>
        <p>個性：＿＿＿＿</p>
        <p>一句話介紹自己：＿＿＿＿</p>
      </div>

      <div class="card" id="experience">
        <h3>🌱 我的經歷</h3>
        <ul>
          <li>2026：開始學習製作網頁</li>
          <li>曾參加：＿＿＿＿</li>
          <li>最難忘的經驗：＿＿＿＿</li>
        </ul>
      </div>

      <div class="card">
        <h3>✨ 興趣與作品</h3>
        <p>我的興趣：＿＿＿＿</p>
        <p>最近在學：＿＿＿＿</p>
        <p>想完成的作品：＿＿＿＿</p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 我的個人網站｜由AI初步製作</p>
  </footer>

</body>
</html>
